server {
    listen      8081;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # The app is a single page: any unknown path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached, or a
    # deploy leaves players on the previous build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Reverse-proxy the API so the browser sees a single origin.
    location /v1/ {
        proxy_pass         http://server:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy        no-referrer always;
}
